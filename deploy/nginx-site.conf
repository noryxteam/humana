# Copie para: /etc/nginx/sites-available/humana
# Depois: sudo ln -sf /etc/nginx/sites-available/humana /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Troque pelo seu domínio (ou use _ para aceitar qualquer host)
    server_name humanacomtrad.com.br www.humanacomtrad.com.br;

    root /var/www/humana;
    index index.html;

    # Logs
    access_log /var/log/nginx/humana.access.log;
    error_log  /var/log/nginx/humana.error.log;

    # Segurança básica
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Arquivos estáticos com cache
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Páginas HTML
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Bloqueia arquivos ocultos e temporários de referência
    location ~ /\. {
        deny all;
    }

    location ~ ^/temp- {
        return 404;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
